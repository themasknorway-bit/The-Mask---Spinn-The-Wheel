<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Spinn hjulet</title>
<style>
  :root{
    --bg: #1B1330;
    --bg-2: #241a3f;
    --gold: #F2B807;
    --gold-dark: #b9880a;
    --coral: #FF6B5B;
    --paper: #FDF6E9;
    --ink: #1B1330;
    --muted: #b9aed6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background: var(--bg); color: var(--paper); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height:100dvh;}
  body{
    display:flex; flex-direction:column; align-items:center;
    min-height:100dvh;
    background:
      radial-gradient(circle at 50% -10%, #3a2a5c 0%, var(--bg) 55%);
    padding: 20px 16px 40px;
  }
  .wrap{ width:100%; max-width:430px; display:flex; flex-direction:column; align-items:center; gap:18px; }

  .title-input{
    width:100%;
    background:transparent;
    border:none;
    color: var(--gold);
    font-size: 26px;
    font-weight:800;
    text-align:center;
    letter-spacing:0.3px;
    font-family: Georgia, 'Times New Roman', serif;
    padding:4px 8px;
    border-bottom: 1px dashed transparent;
  }
  .title-input:focus{ outline:none; border-bottom: 1px dashed var(--gold-dark); }
  .subtitle{ font-size:12px; color:var(--muted); text-align:center; margin-top:-14px; text-transform:uppercase; letter-spacing:1.5px; }

  .wheel-stage{ position:relative; width:100%; aspect-ratio:1/1; max-width:380px; display:flex; align-items:center; justify-content:center; }
  .pointer{
    position:absolute; top:-4px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:5;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--gold);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.4));
  }
  .hub{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background: var(--gold);
    border: 4px solid var(--paper);
    z-index:4;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.35);
    cursor:pointer;
    font-weight:800; color:var(--ink); font-size:13px; letter-spacing:0.5px;
    user-select:none;
  }
  .hub:active{ transform:translate(-50%,-50%) scale(0.94); }
  #wheelCanvas{
    width:100%; height:100%;
    border-radius:50%;
    box-shadow: 0 0 0 6px var(--bg-2), 0 0 0 8px var(--gold-dark), 0 10px 30px rgba(0,0,0,0.5);
  }

  .result{
    min-height:28px;
    font-size:18px; font-weight:700; color:var(--paper);
    text-align:center;
  }
  .result span{ color: var(--gold); }

  .actions{ display:flex; gap:10px; width:100%; }
  .btn{
    flex:1; padding:13px 10px; border-radius:12px; border:none; font-size:15px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background:var(--gold); color:var(--ink); }
  .btn-secondary{ background: rgba(255,255,255,0.08); color: var(--paper); border:1px solid rgba(255,255,255,0.18); }
  .btn:active{ transform: scale(0.97); }
  .btn:disabled{ opacity:0.5; }

  .ticket{
    width:100%; margin-top:6px;
    background: var(--paper);
    color: var(--ink);
    border-radius:16px;
    position:relative;
    box-shadow: 0 8px 22px rgba(0,0,0,0.35);
  }
  .ticket::before, .ticket::after{
    content:""; position:absolute; width:20px; height:20px; background: var(--bg);
    border-radius:50%; top:50%; transform:translateY(-50%);
  }
  .ticket::before{ left:-10px; }
  .ticket::after{ right:-10px; }
  .ticket-inner{ padding:18px 20px; }
  .ticket-header{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom: 2px dashed #d8cdb0; padding-bottom:12px; margin-bottom:14px;
  }
  .ticket-header h2{ margin:0; font-size:15px; letter-spacing:1px; text-transform:uppercase; font-family: Georgia, serif; }
  .count-control{ display:flex; align-items:center; gap:8px; }
  .count-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid #d8cdb0; background:#fff;
    font-size:17px; font-weight:700; color:var(--ink); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .count-btn:active{ background:#f0e9d3; }
  .count-val{ font-weight:800; font-size:15px; min-width:20px; text-align:center; }

  .seg-list{ display:flex; flex-direction:column; gap:8px; max-height:none; }
  .seg-row{ display:flex; align-items:center; gap:8px; }
  .seg-dot{ width:14px; height:14px; border-radius:50%; flex-shrink:0; }
  .seg-input{
    flex:1; border:1px solid #d8cdb0; border-radius:9px; padding:9px 10px; font-size:14px;
    background:#fffdf8; color:var(--ink);
  }
  .seg-input:focus{ outline:none; border-color: var(--gold-dark); }

  .share-row{ margin-top:16px; display:flex; gap:8px; }
  .share-input{
    flex:1; border:1px solid #d8cdb0; border-radius:9px; padding:9px 10px; font-size:12px; color:#665; background:#fffdf8;
  }
  .copy-note{ font-size:12px; color:#7a6f4f; margin-top:6px; min-height:16px; }
  footer{ font-size:11px; color:var(--muted); margin-top:6px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <input id="titleInput" class="title-input" maxlength="40" value="TEAM DIDA" />
  <div class="subtitle">THE MASK</div>

  <div class="wheel-stage">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="hub" id="spinBtn">SPINN</div>
  </div>

  <div class="result" id="resultText">&nbsp;</div>

  <div class="actions">
    <button class="btn btn-secondary" id="editToggle"><span id="editLabel">Rediger hjulet</span></button>
    <button class="btn btn-primary" id="shareBtn">Del lenke</button>
  </div>

  <div class="ticket" id="editPanel" style="display:none;">
    <div class="ticket-inner">
      <div class="ticket-header">
        <h2>Rediger deler</h2>
        <div class="count-control">
          <button class="count-btn" id="minusBtn">-</button>
          <span class="count-val" id="countVal">6</span>
          <button class="count-btn" id="plusBtn">+</button>
        </div>
      </div>
      <div class="seg-list" id="segList"></div>
      <div class="share-row">
        <input class="share-input" id="shareUrl" readonly />
      </div>
      <div class="copy-note" id="copyNote">&nbsp;</div>
    </div>
  </div>

  <footer>Endringer legges automatisk inn i lenken over</footer>
</div>

<script>
const PALETTE = ["#F2B807","#FF6B5B","#2EC4B6","#7B61FF","#F45B9E","#3DBE6C","#4FA8E0","#F28C28","#C77DFF","#E8D14B","#5CD6C0","#FF8FA3"];
const MIN_SEG = 2, MAX_SEG = 12;

let state = {
  title: "TEAM DIDA",
  segments: ["Premie 1","Premie 2","Premie 3","Premie 4","Premie 5","Premie 6"]
};

function loadFromHash(){
  const h = location.hash.replace('#','');
  if(!h) return;
  try{
    const json = decodeURIComponent(escape(atob(h)));
    const data = JSON.parse(json);
    if(data.title && Array.isArray(data.segments) && data.segments.length >= MIN_SEG){
      state.title = data.title.slice(0,40);
      state.segments = data.segments.slice(0, MAX_SEG).map(s => String(s).slice(0,30));
    }
  }catch(e){}
}
loadFromHash();

const titleInput = document.getElementById('titleInput');
const canvas = document.getElementById('wheelCanvas');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const resultText = document.getElementById('resultText');
const editToggle = document.getElementById('editToggle');
const editLabel = document.getElementById('editLabel');
const editPanel = document.getElementById('editPanel');
const segList = document.getElementById('segList');
const countVal = document.getElementById('countVal');
const minusBtn = document.getElementById('minusBtn');
const plusBtn = document.getElementById('plusBtn');
const shareBtn = document.getElementById('shareBtn');
const shareUrl = document.getElementById('shareUrl');
const copyNote = document.getElementById('copyNote');

let rotation = 0;
let spinning = false;

function updateHash(){
  const json = JSON.stringify({title: state.title, segments: state.segments});
  const b64 = btoa(unescape(encodeURIComponent(json)));
  history.replaceState(null, '', '#' + b64);
  shareUrl.value = location.href;
}

function drawWheel(){
  const n = state.segments.length;
  const size = canvas.width;
  const r = size/2;
  ctx.clearRect(0,0,size,size);
  const anglePer = (2*Math.PI)/n;
  for(let i=0;i<n;i++){
    const start = i*anglePer + rotation;
    const end = start + anglePer;
    ctx.beginPath();
    ctx.moveTo(r,r);
    ctx.arc(r,r,r-6,start,end);
    ctx.closePath();
    ctx.fillStyle = PALETTE[i % PALETTE.length];
    ctx.fill();
    ctx.strokeStyle = '#1B1330';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.save();
    ctx.translate(r,r);
    ctx.rotate(start + anglePer/2);
    ctx.textAlign = 'right';
    ctx.fillStyle = '#1B1330';
    ctx.font = '600 22px -apple-system, sans-serif';
    const label = state.segments[i] || '';
    const display = label.length > 16 ? label.slice(0,15)+'…' : label;
    ctx.fillText(display, r-24, 8);
    ctx.restore();
  }
}

function renderEditList(){
  countVal.textContent = state.segments.length;
  segList.innerHTML = '';
  state.segments.forEach((seg, i) => {
    const row = document.createElement('div');
    row.className = 'seg-row';
    const dot = document.createElement('div');
    dot.className = 'seg-dot';
    dot.style.background = PALETTE[i % PALETTE.length];
    const input = document.createElement('input');
    input.className = 'seg-input';
    input.maxLength = 30;
    input.value = seg;
    input.placeholder = 'Del ' + (i+1);
    input.addEventListener('input', () => {
      state.segments[i] = input.value;
      drawWheel();
      updateHash();
    });
    row.appendChild(dot);
    row.appendChild(input);
    segList.appendChild(row);
  });
}

function setSegCount(n){
  n = Math.max(MIN_SEG, Math.min(MAX_SEG, n));
  const cur = state.segments.length;
  if(n > cur){
    for(let i=cur;i<n;i++) state.segments.push('Premie ' + (i+1));
  } else if(n < cur){
    state.segments = state.segments.slice(0,n);
  }
  renderEditList();
  drawWheel();
  updateHash();
}

titleInput.addEventListener('input', () => {
  state.title = titleInput.value || 'TEAM DIDA';
  updateHash();
});

minusBtn.addEventListener('click', () => setSegCount(state.segments.length - 1));
plusBtn.addEventListener('click', () => setSegCount(state.segments.length + 1));

editToggle.addEventListener('click', () => {
  const showing = editPanel.style.display !== 'none';
  editPanel.style.display = showing ? 'none' : 'block';
  editLabel.textContent = showing ? 'Rediger hjulet' : 'Skjul redigering';
});

shareBtn.addEventListener('click', async () => {
  updateHash();
  try{
    await navigator.clipboard.writeText(location.href);
    copyNote.textContent = 'Lenke kopiert! Send den videre.';
  }catch(e){
    copyNote.textContent = 'Kopier lenken manuelt fra feltet under.';
    editPanel.style.display = 'block';
    editLabel.textContent = 'Skjul redigering';
  }
  setTimeout(() => { copyNote.textContent = ''; }, 3500);
});

let spinTimeout = null;
function spin(){
  if(spinning) return;
  spinning = true;
  resultText.innerHTML = '&nbsp;';
  const n = state.segments.length;
  const anglePer = (2*Math.PI)/n;
  const extraTurns = 6 + Math.random()*3;
  const randomOffset = Math.random()*2*Math.PI;
  const targetRotation = rotation + extraTurns*2*Math.PI + randomOffset;

  const duration = 4200;
  const startTime = performance.now();
  const startRot = rotation;
  const delta = targetRotation - startRot;

  function easeOutQuint(t){ return 1 - Math.pow(1-t,5); }

  function frame(now){
    const elapsed = now - startTime;
    const t = Math.min(1, elapsed/duration);
    const eased = easeOutQuint(t);
    rotation = startRot + delta*eased;
    drawWheel();
    if(t < 1){
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      const norm = ((rotation % (2*Math.PI)) + 2*Math.PI) % (2*Math.PI);
      const pointerAt = 1.5*Math.PI;
      const pointerAngle = ((pointerAt - norm) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
      const idx = Math.floor(pointerAngle / anglePer) % n;
      resultText.innerHTML = 'Vinner: <span>' + (state.segments[idx] || '') + '</span>';
    }
  }
  requestAnimationFrame(frame);
}

spinBtn.addEventListener('click', spin);

titleInput.value = state.title;
renderEditList();
drawWheel();
updateHash();
</script>
</body>
</html>
